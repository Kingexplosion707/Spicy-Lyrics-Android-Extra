name: Desktop app (Windows)

# The desktop app (desktop/compose): the Android app's UI on Compose Multiplatform, packaged as a
# Windows installer. Main builds are published as prereleases tagged desktop-v1.0.<run>.

on:
  push:
    branches: [main]
    paths: ["desktop/compose/**", "app/src/main/**", "core/**", "ivlyrics/src/main/**", ".github/workflows/desktop-compose.yml"]
  pull_request:
    paths: ["desktop/compose/**", "app/src/main/**", "core/**", "ivlyrics/src/main/**", ".github/workflows/desktop-compose.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared sources
        run: python desktop/compose/sources.py
      - name: Installer
        shell: bash
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ secrets.SPICY_LYRICS_CLIENT_KEY }}
        run: |
          VERSION=1.0.${{ github.run_number }}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          ./gradlew :desktopApp:packageMsi :desktopApp:packageExe -Pdesktop.version=$VERSION -Pdesktop.platform=windows-x86_64 --stacktrace
          mkdir out
          cp desktop/compose/build/compose/binaries/main/msi/*.msi "out/SpicyLyricsPlus-Desktop-$VERSION.msi"
          cp desktop/compose/build/compose/binaries/main/exe/*.exe "out/SpicyLyricsPlus-Desktop-$VERSION.exe"
          cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done && ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: SpicyLyricsPlus-Desktop
          path: out/*
      - name: Prerelease
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "desktop-v$VERSION" out/* --prerelease --latest=false \
            --title "Spicy Lyrics Plus for Windows $VERSION" \
            --notes "The Spicy Lyrics Plus app for Windows: the Android app's lyrics screen, renderer, backgrounds and settings, following whatever plays through Windows' media controls. Install with the .exe (or the .msi)."
