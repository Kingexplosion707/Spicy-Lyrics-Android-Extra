name: Desktop app + wallpaper

# Builds Spicy Lyrics Plus for Windows outside Spotify (desktop/standalone): the app window, the
# Wallpaper Engine wallpaper and the relay (from Kingexplosion707/Live-Lyrics-for-Wallpaper-Engine),
# packaged as SpicyLyricsPlus-Desktop-Setup-<v>.exe, published as a desktop-app-v* prerelease.

on:
  push:
    branches: [main]
    paths:
      - "desktop/standalone/**"
      - "desktop/spicetify/**"
      - "ivlyrics/src/main/assets/motion/**"
      - "app/src/main/java/com/tx24/spicyplayer/ivlyrics/MotionThemes.kt"
      - ".github/workflows/desktop-app.yml"
  pull_request:
    paths:
      - "desktop/standalone/**"
      - "desktop/spicetify/**"
      - ".github/workflows/desktop-app.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get the relay
        run: |
          curl -fsSL -o relay.zip https://codeload.github.com/Kingexplosion707/Live-Lyrics-for-Wallpaper-Engine/zip/refs/heads/main
          unzip -q relay.zip -d relay-src
          echo "RELAY=$(ls -d "$PWD"/relay-src/*/bridge)" >> "$GITHUB_ENV"
      - name: Build
        working-directory: desktop/standalone/windows
        run: |
          sudo apt-get install -y -q nsis
          pip install -q Pillow
          VERSION="1.0.${GITHUB_RUN_NUMBER}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          python3 package.py --relay "$RELAY" --version "$VERSION"
          node --check ../dist/app/host.js
          (cd ../dist && zip -qr "spicy-lyrics-plus-wallpaper-$VERSION.zip" wallpaper)
      - uses: actions/upload-artifact@v4
        with:
          name: spicy-lyrics-plus-desktop-app
          path: |
            desktop/standalone/dist/*.exe
            desktop/standalone/dist/*.zip
      - name: Publish
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: desktop/standalone/dist
        run: |
          gh release create "desktop-app-v$VERSION" "SpicyLyricsPlus-Desktop-Setup-$VERSION.exe" "spicy-lyrics-plus-wallpaper-$VERSION.zip" \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "Spicy Lyrics Plus desktop app + wallpaper $VERSION" \
            --notes "Run SpicyLyricsPlus-Desktop-Setup-$VERSION.exe: the app (Start menu), the Wallpaper Engine wallpaper and the relay. Settings: the app's gear button; they apply to the wallpaper too."
