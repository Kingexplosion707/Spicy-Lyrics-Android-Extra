name: ivLyrics updates

# Watches ivLyrics Android (github.com/ivLis-Studio/ivLyrics-Android) for new releases. Its code
# has no licence, so nothing is merged: a new release opens an issue labelled ivlyrics-update with
# its release notes, and the features worth having are written into Spicy Lyrics Plus by hand
# (the daily scheduled task picks the issue up). Once done, IVLYRICS_REF in .github/ivlyrics.env
# moves to that release.

on:
  schedule:
    - cron: '53 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ivlyrics-watch

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: .github

      - name: Look for a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source .github/ivlyrics.env
          latest=$(git ls-remote --tags --refs https://github.com/ivLis-Studio/ivLyrics-Android \
            | awk -F/ '{print $3}' | grep -E '^v[0-9]+(\.[0-9]+)*$' | sort -V | tail -1)
          echo "Caught up with $IVLYRICS_REF; newest is $latest."
          if [ -z "$latest" ] || [ "$(printf '%s\n%s\n' "$IVLYRICS_REF" "$latest" | sort -V | tail -1)" = "$IVLYRICS_REF" ]; then
            exit 0
          fi
          title="ivLyrics Android $latest"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --label ivlyrics-update --state open --json title \
            --jq "[.[] | select(.title == \"$title\")] | length")
          if [ "$open" != 0 ]; then echo "Already has an open issue."; exit 0; fi
          gh label create ivlyrics-update --repo "$GITHUB_REPOSITORY" --color 7B61FF \
            --description "A new ivLyrics Android release to look over" 2>/dev/null || true
          {
            echo "ivLyrics Android has new releases since $IVLYRICS_REF, the last one looked over."
            echo
            echo "Compare: https://github.com/ivLis-Studio/ivLyrics-Android/compare/$IVLYRICS_REF...$latest"
            echo
            echo "Write the new user-facing features that fit Spicy Lyrics Plus into its own code (ivLyrics' code"
            echo "has no licence, so none of it is copied), then set IVLYRICS_REF in .github/ivlyrics.env to $latest."
            echo
            # Newest first, down to the release already looked over.
            gh api "repos/ivLis-Studio/ivLyrics-Android/releases?per_page=30" 2>/dev/null \
              | jq -r --arg from "$IVLYRICS_REF" \
                'label $done | .[] | select(.draft | not) | if .tag_name == $from then break $done else "## \(.tag_name)\n\n\(.body // "")\n" end' \
              | head -c 60000 || echo "(The release notes couldn't be read.)"
          } > body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --label ivlyrics-update --title "$title" --body-file body.md
