name: Android CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      # Publishing the optimised build from main as a prerelease.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # The optimised build's notes list the commits since the previous one.
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      # Without the DEBUG_KEYSTORE_BASE64 secret, builds from main still share one key: made here
      # once and kept in this repository's Actions cache (never in the repository or a log), so
      # each build installs over the last and the in-app updater works. Pull requests don't touch
      # it. The scheduled Spicy Lyrics Mobile check reads it too, so it never goes unused long
      # enough to expire.
      - name: Look for the cached debug key
        id: cached-key
        if: github.event_name != 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/cached-key
          key: plus-debug-keystore-v1

      - name: Restore the shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          EVENT: ${{ github.event_name }}
        run: |
          cached="$RUNNER_TEMP/cached-key/debug.keystore"
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          elif [ "$EVENT" != "pull_request" ]; then
            if [ ! -s "$cached" ]; then
              mkdir -p "$(dirname "$cached")"
              keytool -genkeypair -keystore "$cached" -storepass android -keypass android \
                -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US" >/dev/null 2>&1
              echo "NEW_CACHED_KEY=1" >> "$GITHUB_ENV"
              echo "Made the shared debug key; it's kept in the Actions cache from now on."
            fi
            echo "DEBUG_KEYSTORE_FILE=$cached" >> "$GITHUB_ENV"
          else
            echo "Pull request: signed with a throwaway key."
          fi

      - name: Keep the new debug key
        if: env.NEW_CACHED_KEY == '1'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/cached-key
          key: plus-debug-keystore-v1

      - name: Build, test, and lint
        env:
          # The publishable Spicy Lyrics key (sl_pk_), from the repository variable; blank builds without it.
          SPICY_LYRICS_CLIENT_KEY: ${{ vars.SPICY_LYRICS_CLIENT_KEY }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest :core:test lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: spicy-lyrics-plus-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      # Pull requests build the optimised APK too (unsigned, never published): R8 and the baseline
      # profile only run in that build, so a failure there would otherwise first show on main,
      # as a release that never comes.
      - name: Check the optimised build
        if: github.event_name == 'pull_request'
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ vars.SPICY_LYRICS_CLIENT_KEY }}
        run: |
          ./gradlew --no-daemon assembleRelease
          apk=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          unzip -l "$apk" | grep -q 'assets/dexopt/baseline.prof' || { echo "The baseline profile isn't in $apk"; exit 1; }

      # Main gets an optimised (R8) build as well: debug builds run Compose unoptimised and
      # interpreted at first, so their lyrics and animations lag. It's published as a prerelease
      # the app's updater offers, named so it installs over the previous build from main. Manual
      # runs on main publish too: the Spicy Lyrics Mobile updates workflow starts one that way.
      - name: Build the optimised APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SPICY_LYRICS_CLIENT_KEY: ${{ vars.SPICY_LYRICS_CLIENT_KEY }}
          PLUS_BUILD: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Publish the optimised APK
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_number }}
        run: |
          version=$(sed -nE 's/^\s*versionName\s*=\s*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n 1)
          tag="v${version}-plus.${RUN}"
          apk="spicy-lyrics-plus-${tag}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          # What changed since the previous build from main (up to 15 commits), else this commit.
          previous=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- '-plus\.[0-9]+$' | sort -V | awk 'END { print }')
          since=""
          if [ -n "$previous" ]; then
            since=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$previous" --jq .target_commitish 2> /dev/null || true)
          fi
          if [ -n "$since" ] && git cat-file -e "$since^{commit}" 2> /dev/null && [ "$(git rev-parse "$since")" != "$GITHUB_SHA" ]; then
            changes=$(git log --no-merges --format='- %s' "$since..$GITHUB_SHA" | awk 'NR <= 15')
          fi
          [ -n "${changes:-}" ] || changes=$(git log -1 --format='- %s')
          if [ -n "$DEBUG_KEYSTORE_FILE" ]; then
            signing="Signed with the repository's shared key, so it installs over the previous build."
          else
            signing="Signed with a one-off key: uninstall the previous build before installing this one."
          fi
          printf '## Changed\n- **Build %s from main.**\n%s\n\n## Known limitations\n- %s\n' "$RUN" "$changes" "$signing" > notes.md
          gh release create "$tag" "$apk" "$apk.sha256" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Spicy Lyrics Plus ${version} (build ${RUN})" --notes-file notes.md --prerelease
          # Keep the three newest builds from main.
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep -E -- '-plus\.[0-9]+$' | sort -V | head -n -3 \
            | while read -r old; do gh release delete "$old" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true; done
