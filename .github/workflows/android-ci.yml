name: Android CI

on:
  pull_request:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore the shared debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
            echo "DEBUG_KEYSTORE_FILE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret: this build is signed with a throwaway key."
          fi

      - name: Build, test, and lint
        env:
          # The publishable Spicy Lyrics key (sl_pk_), from the repository variable; blank builds without it.
          SPICY_LYRICS_CLIENT_KEY: ${{ vars.SPICY_LYRICS_CLIENT_KEY }}
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest :core:test lintDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: spicy-lyrics-plus-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
