name: iOS app

on:
  push:
    branches: [main]
    paths: ["ios/**", "desktop/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "desktop/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Web app and icon
        run: |
          pip install pillow
          python ios/build_web.py
      - name: Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
      - name: Build (unsigned)
        run: |
          cd ios
          xcodebuild -project SpicyLyricsPlus.xcodeproj -scheme SpicyLyricsPlus -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build | tee build.log | grep -E "error:|warning: .*(Swift|swift)|BUILD" || true
          test -d build/Build/Products/Release-iphoneos/SpicyLyricsPlus.app || { grep -E "error:" -A3 build.log | head -80; exit 1; }
      - name: Package .ipa
        run: |
          cd ios
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SpicyLyricsPlus.app Payload/
          zip -qry SpicyLyricsPlus-unsigned.ipa Payload
          ls -la SpicyLyricsPlus-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: SpicyLyricsPlus-iOS
          path: ios/SpicyLyricsPlus-unsigned.ipa
      - name: Prerelease
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=ios-v1.0.${{ github.run_number }}
          gh release create "$TAG" ios/SpicyLyricsPlus-unsigned.ipa --prerelease --latest=false \
            --title "Spicy Lyrics Plus for iOS 1.0.${{ github.run_number }}" \
            --notes "Unsigned .ipa: sideload with AltStore, SideStore or Sideloadly. Follows Apple Music, and Spotify after signing in with your own Spotify client ID (redirect URI spicylyricsplus://callback)."
